<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cantine QR</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

body {
    font-family: Arial;
    text-align: center;
    background:#f5f5f5;
}

h1 {
    color:#2E7D32;
}

#reader {
    width:320px;
    margin:auto;
}

#result {
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}


.ok {
    color:green;
}


.erreur {
    color:red;
}

</style>

</head>


<body>


<h1>🍽️ Cantine Scolaire</h1>


<div id="reader"></div>


<div id="result">
En attente du scan...
</div>



<script>


const API_URL = "https://script.google.com/macros/s/AKfycbzL_0nXfOEip0sxIxzUUVSz4oJBvup35ZhAAsps1t9IgjZdyEGPQdXB741xFO1DcuVA/exec";



let dejaScanne = false;



function envoyerScan(id){

    const url = API_URL + "?action=scan&qr=" + encodeURIComponent(id);

    document.getElementById("result").innerHTML =
    "Connexion API...";

    fetch(url)

    .then(response => {

        return response.json();

    })

    .then(data => {

        document.getElementById("result").innerHTML =
        "Réponse API :<br>" + JSON.stringify(data);

    })

    .catch(error => {

        document.getElementById("result").innerHTML =
        "Erreur API : " + error;

    });

}





function onScanSuccess(decodedText){

    if(dejaScanne){
        return;
    }

    dejaScanne = true;

    document.getElementById("result").innerHTML =
    "⏳ Vérification...";

    envoyerScan(decodedText);

    setTimeout(()=>{

        dejaScanne=false;

    },3000);

}




const scanner = new Html5QrcodeScanner(
    "reader",
    {
        fps: 10,
        qrbox: 250,
        rememberLastUsedCamera: true,
        supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
    },
    false
);

scanner.render(onScanSuccess);



</script>


</body>

</html>
