<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Test Scanner QR</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial;
    text-align: center;
    padding: 20px;
}

#reader {
    width: 320px;
    margin: auto;
}

#result {
    font-size: 22px;
    margin-top: 20px;
    font-weight: bold;
}

</style>

</head>


<body>

<h2>📷 Test caméra QR</h2>

<div id="reader"></div>

<div id="result">
En attente...
</div>


<script>

const scanner = new Html5Qrcode("reader");


scanner.start(

    {
        facingMode: "environment"
    },

    {
        fps: 10,
        qrbox: 250
    },


    (decodedText)=>{

        document.getElementById("result").innerHTML =
        "QR détecté : " + decodedText;

        scanner.stop();

    },

    (error)=>{

    }

)

.catch(err=>{

document.getElementById("result").innerHTML =
"Erreur : " + err;

});


</script>


</body>

</html>
