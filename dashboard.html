<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tableau de bord - Cantine</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

    <h1>🍽️ Cantine Scolaire</h1>

    <h2>📊 Tableau de bord</h2>


    <div class="dashboard">

        <div class="card">
            <div class="card-icon">👥</div>
            <div class="card-title">
                Élèves
            </div>
            <div id="totalEleves"
                 class="card-value">
                -
            </div>
        </div>


        <div class="card">
            <div class="card-icon">✅</div>
            <div class="card-title">
                Repas pris
            </div>
            <div id="repasPris"
                 class="card-value">
                -
            </div>
        </div>


        <div class="card">
            <div class="card-icon">❌</div>
            <div class="card-title">
                Non passés
            </div>
            <div id="nonPasses"
                 class="card-value">
                -
            </div>
        </div>


        <div class="card">
            <div class="card-icon">📊</div>
            <div class="card-title">
                Participation
            </div>
            <div id="participation"
                 class="card-value">
                -
            </div>
        </div>

    </div>


    <h2>🕐 Derniers repas</h2>

    <div id="derniersRepas">

    <table class="repas-table">

        <thead>

            <tr>
                <th>Heure</th>
                <th>ID</th>
                <th>Élève</th>
                <th>Classe</th>
            </tr>

        </thead>

        <tbody id="listeRepas">

            <tr>
                <td colspan="4">
                    Chargement...
                </td>
            </tr>

        </tbody>

    </table>

</div>


</div>
<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzL_0nXfOEip0sxIxzUUVSz4oJBvup35ZhAAsps1t9IgjZdyEGPQdXB741xFO1DcuVA/exec";

function chargerDashboard() {

    fetch(API_URL + "?action=dashboard")

        .then(response => response.json())

        .then(data => {

            if (data.statut !== "ok") {

                console.error("Erreur API :", data);
                return;

            }

            document.getElementById("totalEleves").textContent =
                data.totalEleves;

            document.getElementById("repasPris").textContent =
                data.repasPris;

            document.getElementById("nonPasses").textContent =
                data.nonPasses;

            document.getElementById("participation").textContent =
                data.participation + "%";

        })

        .catch(error => {

            console.error("Erreur connexion :", error);

        });

}


// Charger automatiquement le tableau de bord
chargerDashboard();

</script>
</body>

</html>
