<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tableau de bord - Cantine</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

    <h1>🍽️ Cantine Scolaire</h1>

    <h2>📊 Tableau de bord</h2>


    <div class="dashboard">

        <div class="card">
            <div class="card-icon">👥</div>
            <div class="card-title">
                Élèves
            </div>
            <div id="totalEleves"
                 class="card-value">
                -
            </div>
        </div>


        <div class="card">
            <div class="card-icon">✅</div>
            <div class="card-title">
                Repas pris
            </div>
            <div id="repasPris"
                 class="card-value">
                -
            </div>
        </div>


        <div class="card">
            <div class="card-icon">❌</div>
            <div class="card-title">
                Non passés
            </div>
            <div id="nonPasses"
                 class="card-value">
                -
            </div>
        </div>


        <div class="card">
            <div class="card-icon">📊</div>
            <div class="card-title">
                Participation
            </div>
            <div id="participation"
                 class="card-value">
                -
            </div>
        </div>

    </div>


    <h2>🕐 Derniers repas</h2>

    <div id="derniersRepas">

        Chargement...

    </div>


</div>

</body>

</html>
